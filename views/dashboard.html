<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <title>Dashboard</title>
  </head>
  <body>
    <h1>Welcome to Dashboard</h1>

    <button id="payBtn">Pay ₹500</button>

    <script>
      const payBtn = document.getElementById("payBtn");

      payBtn.addEventListener("click", payHandler);

      async function payHandler() {
        try {
          const userResponse = await fetch("/api/profile", {
            credentials: "include",
          });

          if (!userResponse.ok) {
            window.location.href = "/login.html";
            return;
          }

          const user = await userResponse.json();
          const [keyResponse, orderResponse] = await Promise.all([
            fetch("/api/key", {
              credentials: "include",
            }),

            fetch(`/api/payment/createOrder/${user._id}`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              credentials: "include",
              body: JSON.stringify({
                amount: 50000,
                currency: "INR",
              }),
            }),
          ]);

          if (!keyResponse.ok) {
            throw new Error("Failed to fetch Razorpay key");
          }

          if (!orderResponse.ok) {
            throw new Error("Failed to create Razorpay order");
          }

          const { key } = await keyResponse.json();
          const order = await orderResponse.json();

          console.log("Key:", key);
          console.log("Order:", order);

          const options = {
            key,
            amount: order.amount,
            currency: order.currency,
            order_id: order.id,

            name: "My Shop",
            description: "Test Payment",

            handler: async function (response) {
              console.log("hello payment done");
              try {
                const verifyResponse = await fetch("/api/payment/verify", {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                  },
                  credentials: "include",
                  body: JSON.stringify({
                    razorpay_payment_id: response.razorpay_payment_id,
                    razorpay_order_id: response.razorpay_order_id,
                    razorpay_signature: response.razorpay_signature,
                    amount: order.amount,
                    currency: order.currency,
                    user: user._id,
                  }),
                });

                const data = await verifyResponse.json();

                if (!verifyResponse.ok) {
                  throw new Error(
                    data.message || "Payment verification failed",
                  );
                }

                alert("Payment Successful!");
                console.log(data);
              } catch (err) {
                console.error(err);
                alert(err.message);
              }
            },

            theme: {
              color: "#3399cc",
            },
          };

          const razorpay = new Razorpay(options);
          razorpay.open();
        } catch (err) {
          console.error(err);
          alert(err.message);
        }
      }
    </script>
  </body>
</html>
